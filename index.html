<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A task manager applicatoion built using JavaScript, HTML, and CSS. It allows users to create, manage, and delete tasks.">
    <meta name="author" content="Ashley Dunn">
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="Scripts/task.js" defer></script>
    <script src="Scripts/data.js" defer></script>
    <script src="Scripts/render.js" defer></script>
    <script src="Scripts/event.js" defer></script>
    <title>Simple Task Manager</title>
</head>
<body>
    <header>
        <h1 id="appTitle">Simple Task Manager</h1>        
    </header>

    <article id="form-layout">
        <form id="taskForm" method="POST">
            
            <div id="form-input">
                <label for="title">Task Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Task Description:</label>
                <textarea rows="5" id="description" name="description" required></textarea>
                
                <label for="status">Task Status:</label>
                    <select id="status" name="status" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
            </div>

            <div id="form-actions">                    
                <button type="submit" id="submitBtn">Add Task</button>
            </div>

        </form>
    </article>

    <article>
        <div>
            <h2 id="task-title">Tasks</h2>
        </div>
        <div id="task-container">
            
        </div>
    </article>

    <footer>
        <p>&copy; 2026 Ashley Dunn. All rights reserved.</p>    
    </footer>
</body>
</html>
